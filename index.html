<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стальной Гром</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #1f2833;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #45f3ff;
        }
        h1 {
            color: #ffffff;
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(69, 243, 255, 0.5);
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #a9b7c6;
        }
        .btn {
            display: inline-block;
            background: #45f3ff;
            color: #0b0c10;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(69, 243, 255, 0.3);
        }
        .btn:hover {
            background: #ffffff;
            box-shadow: 0 4px 25px rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #667484;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Стальной Гром</h1>
        <p>Проект в разработке. Следите за новостями.</p>
        <a href="#" class="btn">Скоро релиз</a>
        <div class="footer">
            &copy; 2026 Стальной Гром
        </div>
    </div>

</body>
</html>
